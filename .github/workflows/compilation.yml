# Fabrique de la fourche noronuke/hermes-mobile.
# À chaque poussée sur main : tests des thèmes (contrastes), APK signé par la clé stable
# gardée en secret GitHub, puis Release « v<amont>-noro.N » lue par Obtainium sur le téléphone.
name: Compilation APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # nécessaire pour publier la Release

concurrency:
  group: compilation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Tests des thèmes + APK signé
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Tests des thèmes (contrastes de la palette)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest --tests 'com.m57.hermescontrol.theme.*'

      - name: Clé de signature (depuis les secrets)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hermes.keystore"

      - name: APK signé
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/hermes.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: hermes
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          AMONT=$(cat VERSION_AMONT)
          ./gradlew --no-daemon assembleRelease \
            -PversionName="${AMONT}-noro.${{ github.run_number }}" \
            -PversionCode="$((300000 + ${{ github.run_number }}))"

      - name: Rapport des tests
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-${{ github.run_number }}
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 3

      - name: Publication d'une Release (pour Obtainium)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat VERSION_AMONT)-noro.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "hermes-${VERSION}.apk"
          gh release create "v${VERSION}" "hermes-${VERSION}.apk" \
            --title "Hermes ${VERSION}" \
            --notes "Compilation automatique du commit ${GITHUB_SHA::7} (amont Hy4ri/hermes-mobile $(cat VERSION_AMONT))." \
            --target "${GITHUB_SHA}"
